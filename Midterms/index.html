<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Food Recipe Finder</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <div class="container-fluid p-4 bg-success">
      <div class="row">
        <div class="col">
          <div class="h1 text-center text-white">Food Recipe Finder</div>
        </div>
      </div>
    </div>

    <div class="container mt-5">
      <div class="row">
        <div class="col-12 col-md-8 align-self-center mx-auto">
          <div class="card search-box p-3 my-3 rounded-4 shadow text-white">
            <h3
              class="text-center mb-3 rounded p-2"
              style="background-color: #198754"
            >
              Find a Recipe
            </h3>

            <form id="searchForm" class="d-flex flex-row">
              <input
                type="text"
                class="form-control rounded-start-pill"
                placeholder="Enter a food name..."
                id="searchInput"
              />

              <button
                type="submit"
                class="btn btn-primary rounded-end-pill"
                id="searchButton"
              >
                Search
              </button>
            </form>
          </div>
        </div>
      </div>
    </div>

    <div class="container">
      <div
        class="text-center my-4"
        id="status"
        role="status"
        aria-live="polite"
      >
        Search for a recipe to get started!
      </div>
    </div>

    <div class="container mb-5">
      <div class="row g-4" id="parent"></div>
    </div>

    <nav aria-label="Recipe pagination">
      <ul class="pagination justify-content-center">
        <li class="page-item">
          <button class="page-link" id="prevButton" type="button" disabled>
            Previous
          </button>
        </li>

        <li class="page-item">
          <span class="page-link" id="currentpage">1</span>
        </li>

        <li class="page-item">
          <button class="page-link" id="nextButton" type="button" disabled>
            Next
          </button>
        </li>
      </ul>
    </nav>

    <div class="container my-4">
      <div class="row justify-content-center">
        <div class="col-3 text-center">
          <div class="card rounded-5 p-3 shadow bg-success">
            <a
              class="h2 text-center"
              style="color: white; text-decoration: none"
              href="https://ennerdajme.github.io/"
              >Back to portfolio</a
            >
          </div>
        </div>
      </div>
    </div>

    <div class="text-center my-4">
      <a
        href="https://www.edamam.com/"
        target="_blank"
        rel="noopener noreferrer"
      >
        Powered by Edamam
      </a>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>

    <script>
      const APP_ID = "416eae41";
      const APP_KEY = "3eaf81c8747c8c4003f8c844d99d1eea";

      const API_URL = "https://api.edamam.com/api/recipes/v2";

      const elSearch = document.getElementById("searchInput");
      const elForm = document.getElementById("searchForm");
      const elParent = document.getElementById("parent");
      const elStatus = document.getElementById("status");
      const elCurrentPage = document.getElementById("currentpage");

      const elPrevButton = document.getElementById("prevButton");
      const elNextButton = document.getElementById("nextButton");
      const elSearchButton = document.getElementById("searchButton");

      let page = 1;
      let nextUrl = null;
      let pageHistory = [];
      let currentPageUrl = null;

      async function getFood() {
        const query = elSearch.value.trim();
        if (!query) {
          elStatus.textContent = "Please enter a food name.";
          elParent.innerHTML = "";
          return;
        }
        if (APP_ID === "YOUR_APP_ID" || APP_KEY === "YOUR_APP_KEY") {
          elStatus.textContent =
            "Please enter your Edamam API credentials first.";
          return;
        }

        page = 1;
        pageHistory = [];
        nextUrl = null;
        currentPageUrl = null;

        const params = new URLSearchParams({
          type: "public",
          q: query,
          app_id: APP_ID,
          app_key: APP_KEY,
          from: "0",
          to: "20",
        });

        const url = `${API_URL}?${params.toString()}`;
        await fetchRecipes(url);
      }

      async function loadDefaultRecipes() {
        page = 1;
        pageHistory = [];
        nextUrl = null;
        currentPageUrl = null;

        const params = new URLSearchParams({
          type: "public",
          q: "food",
          app_id: APP_ID,
          app_key: APP_KEY,
          from: "0",
          to: "20",
        });

        const url = `${API_URL}?${params.toString()}`;
        await fetchRecipes(url);
      }

      async function fetchRecipes(url) {
        try {
          elStatus.textContent = "Loading recipes...";
          elParent.innerHTML = "";

          elSearchButton.disabled = true;
          elPrevButton.disabled = true;
          elNextButton.disabled = true;

          const response = await fetch(url);

          if (!response.ok) {
            const errorDetails = await response.text();
            throw new Error(
              `API request failed: ${response.status} - ${errorDetails}`,
            );
          }

          const data = await response.json();

          currentPageUrl = url;

          const recipes = data.hits || [];

          nextUrl = data._links?.next?.href || null;

          if (recipes.length === 0) {
            elStatus.textContent = "No recipes found.";
            updatePagination();
            return;
          }

          displayRecipes(recipes);

          elStatus.textContent = `${data.count} recipes found for "${elSearch.value}"`;

          updatePagination();
        } catch (error) {
          console.error(error);

          nextUrl = null;

          elStatus.textContent = "Error loading recipes: " + error.message;

          updatePagination();
        } finally {
          elSearchButton.disabled = false;
        }
      }

      let currentRecipes = [];

      function displayRecipes(recipes) {
        elParent.innerHTML = "";

        currentRecipes = recipes.map((item) => item.recipe);
        currentRecipes.forEach((recipe, index) => {
          const image = recipe.image || "";
          const card = `
      <div class="col-12 col-md-4">
  <div class="card recipe-card rounded-4 shadow overflow-hidden h-100">
    <a href="view.html" class="recipe-link" data-index="${index}">
      <div class="recipe-image-container">
        <img
          src="${escapeHTML(image)}"
          class="img-fluid w-100 h-100"
          alt="${escapeHTML(recipe.label)}"
          loading="lazy"
        >
      </div>
    </a>
  </div>
</div>
    `;

          elParent.innerHTML += card;
        });
      }

      function escapeHTML(value) {
        return String(value ?? "").replace(
          /[&<>"']/g,
          (character) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#039;",
            })[character],
        );
      }

      function updatePagination() {
        elCurrentPage.textContent = page;

        elPrevButton.disabled = page === 1;
        elNextButton.disabled = !nextUrl;
      }

      async function prev() {
        if (pageHistory.length === 0) return;

        const previousUrl = pageHistory.pop();

        page--;

        await fetchRecipes(previousUrl);
      }

      async function next() {
        if (!nextUrl || !currentPageUrl) return;

        pageHistory.push(currentPageUrl);

        const requestedUrl = nextUrl;

        page++;

        await fetchRecipes(requestedUrl);
      }

      elForm.addEventListener("submit", (event) => {
        event.preventDefault();
        getFood();
      });

      elPrevButton.addEventListener("click", prev);
      elNextButton.addEventListener("click", next);

      window.addEventListener("DOMContentLoaded", async () => {
        const savedPage = sessionStorage.getItem("recipePageState");

        if (savedPage) {
          const savedState = JSON.parse(savedPage);
          page = savedState.page;
          pageHistory = savedState.pageHistory;
          elSearch.value = savedState.searchQuery;
          await fetchRecipes(savedState.currentPageUrl);
        } else {
          loadDefaultRecipes();
        }
      });

      elParent.addEventListener("click", (event) => {
        const link = event.target.closest(".recipe-link");
        if (!link) return;
        event.preventDefault();
        const index = Number(link.dataset.index);
        const selectedRecipe = currentRecipes[index];

        if (!selectedRecipe) return;
        sessionStorage.setItem(
          "selectedRecipe",
          JSON.stringify(selectedRecipe),
        );

        sessionStorage.setItem(
          "recipePageState",
          JSON.stringify({
            page: page,
            pageHistory: pageHistory,
            currentPageUrl: currentPageUrl,
            searchQuery: elSearch.value,
          }),
        );

        window.location.href = "view.html";
      });
    </script>
  </body>
</html>
