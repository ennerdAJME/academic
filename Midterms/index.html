<!doctype html>
<html lang="en" data-bs-theme="light">
  <head>
    <title>Team Fortress 2 Mercs</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="container-fluid p-4 p-md-5">
      <div class="card tf2-card rounded-4 p-4 p-md-5 shadow mb-4 text-white">
        <div class="h1 text-center mb-0">Team Fortress 2 Mercs</div>
      </div>

    <div class="container">
      <div class="card search-box p-3 my-4 rounded-4 shadow text-white">
      <div class="h3 text-center">Find a Mercenary</div>

      <div class="row g-3">

        <div class="col-md-6">
          <input
            type="text"
            id="search"
            class="form-control"
            placeholder="Search mercenary name..."
          >
        </div>

        <div class="col-md-6">
          <select id="roleFilter" class="form-select">
            <option value="all">All Roles</option>
            <option value="offensive">Offensive</option>
            <option value="defensive">Defensive</option>
            <option value="support">Support</option>
          </select>
        </div>
      </div>
    </div>
    </div>
    <div class="container p-2 align-items-center justify-content-center d-flex">
    <nav>
          <ul class="pagination justify-content-center">
            <li class="page-item">
              <button class="page-link" onclick="prev()">
                Previous
              </button>
            </li>
            <li class="page-item">
              <span class="page-link" id="currentpage">1</span>
            </li>
            <li class="page-item">
              <button class="page-link" onclick="next()">
                Next
              </button>
            </li>
          </ul>
        </nav>
  </div>

    <div class="container">
      <div class="row g-4" id="parent"></div>
    </div>

    <div class="container my-4">
      <div class="row justify-content-center">
        <div class="col-3 text-center">
          <div class="card rounded-5 p-3 shadow">
            <a
              class="h2 text-center"
              style="color: white; text-decoration: none"
              href="https://ennerdajme.github.io/"
              >Back to portfolio</a
            >
          </div>
        </div>
      </div>
    </div>

    <script>
      const mercs = [
        {
          tf2class: "Scout",
          classtype: "(Offense)",
          image: "Scout_Full_Body.webp",          
        },
        {
          tf2class: "Demoman",
          classtype: "(Defense)",
          image: "Demoman.webp",          
        },
        {
          tf2class: "Medic",
          classtype: "(Support)",
          image: "Medic.webp",
        },
        {
          tf2class: "Soldier",
          classtype: "(Offense)",
          image: "250px-Soldier.webp",          
        },
        {
          tf2class: "Heavy",
          classtype: "(Defense)",
          image: "H.W.G.webp",          
        },
        {
          tf2class: "Sniper",
          classtype: "(Support)",
          image: "Sniper.webp",
        },
        {
          tf2class: "Pyro",
          classtype: "(Offense)",
          image: "300px-Pyro.webp",          
        },
        {
          tf2class: "Engineer",
          classtype: "(Defense)",
          image: "300px-Engineer.webp",          
        },
        {
          tf2class: "Spy",
          classtype: "(Support)",
          image: "Spy.webp",          
        },
      ];

     function capitalizeFirstLetter(str) {
      if (!str) return str;
      return str.charAt(0).toUpperCase() + str.slice(1);
    }

      const elParent = document.getElementById("parent");

      for (let i = 0; i < mercs.length; i++) {
        elParent.innerHTML += `
          <div class="col-12 col-md-6 col-lg-4">
            <div class="card tf2-card merc-card p-3 shadow rounded-4 text-center text-white">

              <h2 class="h3">
                ${mercs[i].tf2class}
              </h2>

              <p class="fw-bold mb-2">
                ${mercs[i].classtype}
              </p>

              <img
                src="images/${mercs[i].image}"
                alt="${mercs[i].tf2class}"
                class="merc-image mb-3"
                loading="lazy"
              />

            </div>
          </div>
        `;
      }
    </script>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
