<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TF2 Mercenary Database</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link href="style.css" rel="stylesheet" />
  </head>

  <body>
    <div class="container-fluid p-4">
      <div class="card tf2-card rounded-4 p-4 p-md-5 shadow mb-4 text-white">
        <h1 class="text-center mb-0">Team Fortress 2 Mercs</h1>
      </div>
    </div>

    <div class="container">
      <div class="card search-box p-3 my-3 md-5 rounded-4 shadow text-white">
        <h3 class="text-center">Find a Mercenary</h3>
        <div class="row g-3">
          <div class="col-md-6">
            <input
              type="text"
              id="search"
              class="form-control"
              placeholder="Search mercenary name..."
            />
          </div>

          <div class="col-md-6">
            <select id="roleFilter" class="form-select">
              <option value="all">All Roles</option>
              <option value="offensive">Offensive</option>
              <option value="defensive">Defensive</option>
              <option value="support">Support</option>
            </select>
          </div>
        </div>
      </div>

      <nav>
        <ul class="pagination justify-content-center">
          <li class="page-item">
            <button class="page-link" onclick="prev()">Previous</button>
          </li>
          <li class="page-item">
            <span class="page-link" id="currentpage">1</span>
          </li>
          <li class="page-item">
            <button class="page-link" onclick="next()">Next</button>
          </li>
        </ul>
      </nav>

      <div class="text-center text-white mb-3" id="status">
        Loading mercenary information...
      </div>
    </div>

    <div class="container">
      <div class="row" id="parent"></div>
    </div>

    <script>
      const mercenaries = [
        {
          id: "scout",
          name: "Scout",
          role: "offensive",
          image: "Scout_Full_Body.webp",
          description:
            "The fastest mercenary on the battlefield. Scout uses his speed and double jump to outmaneuver opponents.",
        },
        {
          id: "soldier",
          name: "Soldier",
          role: "offensive",
          image: "250px-Soldier.webp",
          description:
            "A powerful combatant who uses his rocket launcher to deal explosive damage and control the battlefield.",
        },
        {
          id: "pyro",
          name: "Pyro",
          role: "offensive",
          image: "300px-Pyro.webp",
          description:
            "A mysterious mercenary who uses a flamethrower to burn enemies and protect teammates.",
        },
        {
          id: "demoman",
          name: "Demoman",
          role: "defensive",
          image: "Demoman.webp",
          description:
            "An explosives expert who uses grenades and sticky bombs to defend important areas.",
        },
        {
          id: "heavy",
          name: "Heavy",
          role: "defensive",
          image: "H.W.G.webp",
          description:
            "A heavily armed mercenary who uses his minigun and high health to withstand enemy attacks.",
        },
        {
          id: "engineer",
          name: "Engineer",
          role: "defensive",
          image: "300px-Engineer.webp",
          description:
            "A talented builder who constructs sentry guns, dispensers, and teleporters to support his team.",
        },
        {
          id: "medic",
          name: "Medic",
          role: "support",
          image: "Medic.webp",
          description:
            "A doctor who heals teammates and uses his ÜberCharge to give allies temporary invulnerability.",
        },
        {
          id: "sniper",
          name: "Sniper",
          role: "support",
          image: "Sniper.webp",
          description:
            "A long-range marksman who eliminates enemies using precise shots from his sniper rifle.",
        },
        {
          id: "spy",
          name: "Spy",
          role: "support",
          image: "Spy.webp",
          description:
            "A stealth specialist who disguises himself, becomes invisible, and eliminates enemies through backstabbing.",
        },
      ];

      const elParent = document.getElementById("parent");
      const elCurrentPage = document.getElementById("currentpage");
      const elStatus = document.getElementById("status");

      const elSearch = document.getElementById("search");
      const elRoleFilter = document.getElementById("roleFilter");

      let page = 1;
      const perPage = 3;
      let filteredMercs = [...mercenaries];

      const API_URL =
        "https://raw.githubusercontent.com/tsuza/tf2-item-schema/master/files/json.txt";
      let apiClasses = [];
      async function getMercenaries() {
        try {
          const response = await fetch(API_URL);
          if (!response.ok) {
            throw new Error("Unable to retrieve TF2 schema.");
          }
          const data = await response.json();
          const items = data.result?.items || data.items || [];

          apiClasses = [
            ...new Set(
              items
                .flatMap((item) => item.used_by_classes || [])
                .map((name) => name.toLowerCase()),
            ),
          ];
        } catch (error) {
          console.error("Error fetching TF2 schema:", error);
        } finally {
          displayMercenaries();
        }
      }

      function capitalizeFirstLetter(str) {
        return str.charAt(0).toUpperCase() + str.slice(1);
      }

      function applyFilters() {
        const searchValue = elSearch.value.toLowerCase();
        const roleValue = elRoleFilter.value;
        filteredMercs = mercenaries.filter((merc) => {
          const matchesName = merc.name.toLowerCase().includes(searchValue);
          const matchesRole = roleValue === "all" || merc.role === roleValue;
          return matchesName && matchesRole;
        });
        page = 1;
        displayMercenaries();
      }

      function displayMercenaries() {
        elParent.innerHTML = "";
        const finalPage = Math.max(
          1,
          Math.ceil(filteredMercs.length / perPage),
        );
        const start = (page - 1) * perPage;
        const currentMercs = filteredMercs.slice(start, start + perPage);
        elCurrentPage.innerHTML = page;
        elStatus.innerHTML = filteredMercs.length + " mercenaries found";
        if (currentMercs.length === 0) {
          elParent.innerHTML = `
      <div class="col-12">
        <div class="alert alert-warning text-center">
          No mercenaries found.
        </div>
      </div>
    `;
          return;
        }

        currentMercs.forEach((merc) => {
          const role = capitalizeFirstLetter(merc.role);
          elParent.innerHTML += `
      <div class="col-12 col-md-4">
        <div class="card merc-card rounded-4 shadow p-4 text-center text-white">
          <h2 class="mb-2">
              ${merc.id}
              ${merc.name}
            </a>
          </h2>
          <h5 class="mb-3">
            (${role})
          </h5>
          <img
            src="images/${merc.image}"
            alt="${merc.name}"
            class="merc-image"
          >
        </div>
      </div>
    `;
        });
      }
      function prev() {
        const finalPage = Math.max(
          1,
          Math.ceil(filteredMercs.length / perPage),
        );
        page--;
        if (page < 1) {
          page = finalPage;
        }
        displayMercenaries();
      }

      function next() {
        const finalPage = Math.max(
          1,
          Math.ceil(filteredMercs.length / perPage),
        );
        page++;
        if (page > finalPage) {
          page = 1;
        }
        displayMercenaries();
      }

      elSearch.addEventListener("input", applyFilters);
      elRoleFilter.addEventListener("change", applyFilters);
      getMercenaries();
    </script>
  </body>
</html>
